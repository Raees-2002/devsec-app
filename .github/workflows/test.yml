name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-scan:
    name: Build and Security Scan
    runs-on: ubuntu-latest

    steps:
    # 1. Checkout code
    - name: Checkout Repository
      uses: actions/checkout@v3

    # 2. Set up Docker Buildx (best practice)
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 3. Build Docker image
    - name: Build Docker Image
      run: docker build -t devsec-app .

    # 4. Run Trivy Scan (Security Gate)
    - name: Run Trivy Vulnerability Scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: devsec-app
        format: table
        exit-code: 1
        severity: CRITICAL,HIGH

    # 5. Success message
    - name: Security Gate Passed
      run: echo "✅ No CRITICAL/HIGH vulnerabilities found. Pipeline passed."