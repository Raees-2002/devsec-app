name: DevSecOps CI Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  build-scan-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # 🔹 Build Image
    - name: Build Docker Image
      run: docker build -t devsec-app .

    # 🔹 Security Scan (Gate)
    - name: Run Trivy Scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: devsec-app
        exit-code: 1
        severity: CRITICAL,HIGH

    # 🔹 Configure AWS Credentials
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v2
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ secrets.AWS_REGION }}

    # 🔹 Login to ECR
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    # 🔹 Tag Image
    - name: Tag Docker Image
      run: |
        docker tag devsec-app:latest ${{ secrets.ECR_REGISTRY }}/devsec-app:latest

    # 🔹 Push Image
    - name: Push to ECR
      run: |
        docker push ${{ secrets.ECR_REGISTRY }}/devsec-app:latest

    - name: Done
      run: echo "🚀 Image pushed securely to ECR"